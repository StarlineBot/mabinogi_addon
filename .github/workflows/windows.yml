name: Windows validation
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact release version X.Y.Z (top bundled notes must match)'
        required: true
        type: string
      mode:
        description: '검증만 / 성공 시 동일 exe 배포 / 기존 후보 배포 (조건부 게시 승인)'
        required: true
        default: verify-only
        type: choice
        options:
          - verify-only
          - validate-and-publish
          - publish-existing
      candidate_run:
        description: '기존 후보가 여러 개인 경우에만 검증 실행 ID 지정 (보통 비움)'
        required: false
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: verified-windows-candidate
  cancel-in-progress: false
jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.freeze.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_VERSION: ${{ inputs.version }}
      REQUEST_MODE: ${{ inputs.mode }}
      REQUEST_CANDIDATE_RUN: ${{ inputs.candidate_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Freeze release request
        id: freeze
        run: python -m scripts.release_automation prepare
      - name: Store release request
        uses: actions/upload-artifact@v4
        with:
          name: release-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-request/release-request.json
          retention-days: 1
          if-no-files-found: error
  validate:
    needs: request
    if: github.ref == 'refs/heads/main' && inputs.mode != 'publish-existing'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.request.outputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      OPENCV_FOR_THREADS_NUM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev --group build
      - name: Validate candidate version
        run: >-
          uv run python -m scripts.release_candidate preflight --sha "$env:GITHUB_SHA" --version "$env:APP_VERSION"
      - name: Isolated regression
        id: unit
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen python -m scripts.run_regressions --diagnostics test-diagnostics/unit --case-timeout 180 --session-timeout 1500 -- -n 2 -vv -ra -m 'not windows_integration' --durations=30 --junitxml=unit-results.xml
      - name: Native Windows integration
        id: native
        env:
          QT_QPA_PLATFORM: windows
        run: uv run --frozen python -m scripts.run_regressions --diagnostics test-diagnostics/native --case-timeout 180 --session-timeout 600 -- -vv -ra -m windows_integration --durations=30 --junitxml=windows-results.xml
      - name: Collect regression diagnostics
        if: always()
        run: uv run --frozen python -m scripts.run_regressions --diagnostics test-diagnostics --collect-only
      - name: Store regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-diagnostics/**/public/*
          retention-days: 1
          if-no-files-found: warn
          compression-level: 6
      - name: Verify clean checkout after tests
        run: |
          git diff --quiet HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Tests changed tracked source inputs' }
          $extra = git ls-files --others --exclude-standard -- src packaging
          if ($LASTEXITCODE -ne 0 -or $extra) { throw 'Unexpected untracked build inputs' }
      # Only controlled version/secret generation follows the clean-source check.
      - name: Inject bundled secrets
        shell: python
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          INQUIRY_WEBHOOK_URL: ${{ secrets.INQUIRY_WEBHOOK_URL }}
          CONFIG_WEBHOOK_URL: ${{ secrets.CONFIG_WEBHOOK_URL }}
        run: |
          import os
          from pathlib import Path
          names = ('NEXON_API_KEY', 'INQUIRY_WEBHOOK_URL', 'CONFIG_WEBHOOK_URL')
          Path('src/mabinogi_addon/_bundled.py').write_text(''.join(f'{n} = {os.environ.get(n, "")!r}\n' for n in names), encoding='utf-8')
      - name: Verify exe build
        id: build
        run: uv run --frozen --group build python packaging/build_windows.py --version "$env:APP_VERSION"
      - name: Seal verified candidate
        run: >-
          uv run python -m scripts.release_candidate seal --version "$env:APP_VERSION"
          --sha "$env:GITHUB_SHA" --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT
          --mode "$env:RELEASE_MODE"
      - name: Enforce candidate retention
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m scripts.release_candidate prune
      - name: Store verified candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: verified-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Verification summary
        if: always()
        run: >-
          uv run python scripts/windows_ci.py summary --unit '${{ steps.unit.outcome }}'
          --native '${{ steps.native.outcome }}' --build '${{ steps.build.outcome }}'
          --upload '${{ steps.upload.outcome }}'
