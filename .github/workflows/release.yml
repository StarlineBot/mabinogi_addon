name: Promote verified Windows candidate
# Only the user's explicit dispatch publishes. A tag alone does nothing.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Windows validation run ID'
        required: true
        type: string
      attempt:
        description: 'Successful run attempt'
        required: true
        default: '1'
        type: string
      source_sha:
        description: 'Full validated source SHA (tag must point here)'
        required: true
        type: string
      version:
        description: 'Exact verified X.Y.Z version'
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: verified-windows-candidate
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ inputs.source_sha }}
      CANDIDATE_VERSION: ${{ inputs.version }}
      CANDIDATE_RUN: ${{ inputs.run_id }}
      CANDIDATE_ATTEMPT: ${{ inputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful run and unchanged inputs
        id: gate
        run: >-
          python -m scripts.release_candidate gate --sha "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION"
          --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.gate.outputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify candidate bytes and lifetime
        run: python -m scripts.release_candidate check
      - uses: actions/checkout@v4
        with:
          repository: StarlineBot/mabinogi_addon-releases
          ref: main
          token: ${{ secrets.RELEASES_TOKEN }}
          path: pub
      - name: Publish exact verified files
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: python -m scripts.release_delivery
