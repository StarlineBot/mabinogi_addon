name: Publish approved Windows candidate
# Ordinary pushes and tag pushes never publish. The user's dispatch receipt
# binds the approval to a source/version/run/attempt; success alone is insufficient.
on:
  workflow_run:
    workflows: [Windows validation]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: verified-windows-candidate
  cancel-in-progress: false
jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Privileged code always comes from the trusted default branch, never an artifact.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check dispatch approval
        id: approval
        run: python -m scripts.release_automation authorize
      - uses: actions/checkout@v4
        if: steps.approval.outputs.publish == 'true'
        with:
          repository: StarlineBot/mabinogi_addon-releases
          ref: main
          token: ${{ secrets.RELEASES_TOKEN }}
          path: pub
      - name: Verify approval and publish exact verified files
        if: steps.approval.outputs.publish == 'true'
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: python -m scripts.release_automation complete
