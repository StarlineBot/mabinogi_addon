name: release

# 태그(vX.Y.Z) 푸시 → Windows exe 빌드 후 GitHub Release에 첨부.
# 수동 실행(workflow_dispatch)은 빌드만 하고 아티팩트로 올린다(릴리스는 안 만듦).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # 릴리스에 exe 업로드
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync deps (+ build group)
        run: uv sync --group build

      - name: Inject bundled secrets
        shell: bash
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          INQUIRY_WEBHOOK_URL: ${{ secrets.INQUIRY_WEBHOOK_URL }}
          CONFIG_WEBHOOK_URL: ${{ secrets.CONFIG_WEBHOOK_URL }}
        run: |
          uv run python - <<'PY'
          import os
          open("src/mabinogi_addon/_bundled.py", "w", encoding="utf-8").write(
              f'NEXON_API_KEY = {os.environ.get("NEXON_API_KEY", "")!r}\n'
              f'INQUIRY_WEBHOOK_URL = {os.environ.get("INQUIRY_WEBHOOK_URL", "")!r}\n'
              f'CONFIG_WEBHOOK_URL = {os.environ.get("CONFIG_WEBHOOK_URL", "")!r}\n'
          )
          PY

      - name: Set version from tag
        shell: bash
        run: |
          # 태그(vX.Y.Z)면 그 버전, 아니면(수동 실행) 0.0.0.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0"; fi
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          APP_VERSION="$VER" uv run python - <<'PY'
          import os
          ver = os.environ["APP_VERSION"]
          # 소스 버전 주입(앱 창 제목·설정에 표시)
          with open("src/mabinogi_addon/version.py", "w", encoding="utf-8") as f:
              f.write('from __future__ import annotations\n\n')
              f.write(f'__version__ = {ver!r}\n\n\n')
              f.write('def display_version() -> str:\n')
              f.write('    return "개발" if __version__ == "0.0.0" else f"v{__version__}"\n')
          # exe 파일 속성(버전 리소스)용 version-file 생성
          parts = [int(x) for x in (ver.split(".") + ["0", "0", "0"])[:3] if x.isdigit()]
          while len(parts) < 3:
              parts.append(0)
          v4 = tuple(parts[:3]) + (0,)
          info = f"""VSVersionInfo(
  ffi=FixedFileInfo(filevers={v4}, prodvers={v4}, mask=0x3f, flags=0x0,
    OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
  kids=[
    StringFileInfo([StringTable('041204b0', [
      StringStruct('CompanyName', 'HP Starline'),
      StringStruct('FileDescription', '섯다라인 마비노기 애드온'),
      StringStruct('FileVersion', {ver!r}),
      StringStruct('InternalName', 'mabinogi-addon'),
      StringStruct('OriginalFilename', 'mabinogi-addon.exe'),
      StringStruct('ProductName', '섯다라인 마비노기 애드온'),
      StringStruct('ProductVersion', {ver!r})])]),
    VarFileInfo([VarStruct('Translation', [0x0412, 1200])])
  ]
)
"""
          with open("packaging/version_info.txt", "w", encoding="utf-8") as f:
              f.write(info)
          print("version:", ver, v4)
          PY

      - name: Build exe (PyInstaller)
        run: >
          uv run --group build pyinstaller --noconfirm --clean --onefile --windowed
          --name mabinogi-addon
          --icon packaging/logo.ico
          --version-file packaging/version_info.txt
          --paths src
          --add-data "src/mabinogi_addon/assets;assets"
          --collect-all PySide6
          --collect-all dxcam
          --collect-all comtypes
          --hidden-import win32gui
          --hidden-import win32process
          --hidden-import win32con
          packaging/entry.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mabinogi-addon-exe
          path: dist/mabinogi-addon.exe

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mabinogi-addon.exe
