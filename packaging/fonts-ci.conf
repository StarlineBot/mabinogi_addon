<?xml version="1.0"?>
<!-- 로컬(리눅스 QA 컨테이너) 배포 검사를 CI 러너(ubuntu-24.04 + regression.yml·windows.yml이 설치하는 fonts-noto-cjk)와
     같은 글꼴로 — CI에 없는 글꼴을 빼서 한글은 Noto Sans CJK, 기본 라틴은 DejaVu Sans가 되게 한다.
     0.52.0 후보 #243: 로컬 통과, CI에서 test_music_buff 스크롤 실패(글꼴 폭 차이).
     scripts/run_release_checks.py가 로컬에서 FONTCONFIG_FILE이 비어 있으면 자동으로 쓴다(fonts-noto-cjk가 없으면 경고).
     로컬에 없으면: sudo apt-get install -y fonts-noto-cjk -->
<fontconfig><include>/etc/fonts/fonts.conf</include><selectfont><rejectfont>
<glob>/usr/share/fonts/opentype/inter/*</glob><glob>/usr/share/fonts/truetype/wqy/*</glob>
<glob>/usr/share/fonts/opentype/unifont/*</glob><glob>/usr/share/fonts/truetype/unifont/*</glob>
<glob>/usr/share/fonts/truetype/nanum/*</glob><glob>/usr/share/fonts/opentype/ipafont-gothic/*</glob>
</rejectfont></selectfont></fontconfig>
